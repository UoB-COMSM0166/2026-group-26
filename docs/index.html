<!DOCTYPE html>
<html lang="en">
  <head>
    <script defer src="scripts/vendor/p5.min.js?v=20260416b"></script>
    <script>
      window.addEventListener('error', function (event) {
        var box = document.getElementById('boot-error-box');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error-box';
          box.style.position = 'fixed';
          box.style.left = '10px';
          box.style.right = '10px';
          box.style.bottom = '10px';
          box.style.maxHeight = '45vh';
          box.style.overflow = 'auto';
          box.style.background = 'rgba(0,0,0,0.85)';
          box.style.color = '#ff6b6b';
          box.style.padding = '12px';
          box.style.zIndex = '99999';
          box.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(box);
        }
        box.textContent = 'Runtime Error: ' + (event.message || 'unknown') + '\n' + (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0);
      });
      window.addEventListener('unhandledrejection', function (event) {
        var box = document.getElementById('boot-error-box');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error-box';
          box.style.position = 'fixed';
          box.style.left = '10px';
          box.style.right = '10px';
          box.style.bottom = '10px';
          box.style.maxHeight = '45vh';
          box.style.overflow = 'auto';
          box.style.background = 'rgba(0,0,0,0.85)';
          box.style.color = '#ff6b6b';
          box.style.padding = '12px';
          box.style.zIndex = '99999';
          box.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(box);
        }
        box.textContent = 'Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason));
      });
    </script>
    <script>
      (function () {
        try {
          var savedApiBaseUrl = localStorage.getItem('apiBaseUrl');
          if (!savedApiBaseUrl) return;
          var savedUrl = new URL(savedApiBaseUrl, window.location.origin);
          var currentHost = window.location.hostname;
          var isCurrentLocal = currentHost === 'localhost' || currentHost === '127.0.0.1';
          if (!isCurrentLocal && savedUrl.hostname !== currentHost) {
            localStorage.removeItem('apiBaseUrl');
          }
        } catch (err) {
          localStorage.removeItem('apiBaseUrl');
        }
      })();
    </script>
