<!DOCTYPE html>
<html lang="en">
  <head>
    <script defer src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js" crossorigin></script>
    <script>
      window.addEventListener('error', function (event) {
        var box = document.getElementById('boot-error-box');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error-box';
          box.style.position = 'fixed';
          box.style.left = '10px';
          box.style.right = '10px';
          box.style.bottom = '10px';
          box.style.maxHeight = '45vh';
          box.style.overflow = 'auto';
          box.style.background = 'rgba(0,0,0,0.85)';
          box.style.color = '#ff6b6b';
          box.style.padding = '12px';
          box.style.zIndex = '99999';
          box.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(box);
        }
        box.textContent = 'Runtime Error: ' + (event.message || 'unknown') + '\n' + (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0);
      });
      window.addEventListener('unhandledrejection', function (event) {
        var box = document.getElementById('boot-error-box');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error-box';
          box.style.position = 'fixed';
          box.style.left = '10px';
          box.style.right = '10px';
          box.style.bottom = '10px';
          box.style.maxHeight = '45vh';
          box.style.overflow = 'auto';
          box.style.background = 'rgba(0,0,0,0.85)';
          box.style.color = '#ff6b6b';
          box.style.padding = '12px';
          box.style.zIndex = '99999';
          box.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(box);
        }
        box.textContent = 'Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason));
      });
    </script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="//8.208.77.85" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <meta charset="utf-8" />

    <link rel="preload" href="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js" as="script" crossorigin>

    <link rel="preload" href="style.css" as="style">
  </head>

  </body>
</html>
