server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hotlineescape.top www.hotlineescape.top;

    location ^~ /.well-known/ {
        root /srv/2026-group-26;
        try_files $uri =404;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name hotlineescape.top www.hotlineescape.top;

    ssl_certificate /srv/2026-group-26/ssl/hotlineescape.top_cert_chain.pem;
    ssl_certificate_key /srv/2026-group-26/ssl/hotlineescape.top_key.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /srv/2026-group-26/docs;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|mp4|webm|wav|mp3|woff2?)$ {
        root /srv/2026-group-26/docs;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
